app = "haxbot"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # Room advertised in Morocco (Casablanca), as in haxbot-EN.js.
  GEO_CODE = "MA"
  GEO_LAT = "33.5731"
  GEO_LON = "-7.5898"

[http_service]
  internal_port = 3000
  force_https = false
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [http_service.http_options]
    [http_service.http_options.response]
      [http_service.http_options.response.headers]
        X-Robots-Tag = "noindex"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
